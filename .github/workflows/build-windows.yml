name: Build CANEFLOW Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CANEFLOW --add-data "irrigation_advisor.db;." main.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CANEFLOW-Windows
          path: dist/CANEFLOW.exe
          if-no-files-found: error
